<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 176" width="100%" role="img" aria-label="Japanese Sunset Arcade Ending">
  <defs>
    <linearGradient id="footBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0724"/>
      <stop offset="28%" stop-color="#3a0d54"/>
      <stop offset="52%" stop-color="#b82460"/>
      <stop offset="63%" stop-color="#ff8c42"/>
      <stop offset="64%" stop-color="#22093a"/>
      <stop offset="100%" stop-color="#070614"/>
    </linearGradient>
    <linearGradient id="footSun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff07c"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ff2a85"/>
    </linearGradient>
    <linearGradient id="footBorder" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <filter id="footGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="footGlowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="skyClip">
      <rect x="4" y="4" width="872" height="108"/>
    </clipPath>
    <pattern id="footScan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#000000" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- Sunset Sky + Dusk Water Backdrop -->
  <rect x="2" y="2" width="876" height="172" rx="10" fill="url(#footBg)"/>

  <!-- Setting Striped Sunset Sun clipped at waterline -->
  <g clip-path="url(#skyClip)">
    <circle cx="440" cy="108" r="44" fill="url(#footSun)" opacity="0.92"/>
    <g fill="#731659" opacity="0.6">
