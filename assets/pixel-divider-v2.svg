<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 42" width="100%" role="img" aria-label="Neon Sakura Pixel Cyber Divider">
  <defs>
    <linearGradient id="divRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="30%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#ffd166"/>
      <stop offset="70%" stop-color="#9d4edd"/>
      <stop offset="100%" stop-color="#00f5d4"/>
    </linearGradient>
    <filter id="divGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Outer subtle trace lines -->
  <line x1="22" y1="12" x2="396" y2="12" stroke="#3c1668" stroke-width="1"/>
  <line x1="484" y1="12" x2="858" y2="12" stroke="#3c1668" stroke-width="1"/>
  <line x1="22" y1="30" x2="396" y2="30" stroke="#3c1668" stroke-width="1"/>
  <line x1="484" y1="30" x2="858" y2="30" stroke="#3c1668" stroke-width="1"/>

  <!-- Main glowing gradient neon rail -->
  <rect x="22" y="20" width="382" height="2" fill="url(#divRail)" opacity="0.88" filter="url(#divGlow)"/>
  <rect x="476" y="20" width="382" height="2" fill="url(#divRail)" opacity="0.88" filter="url(#divGlow)"/>

  <!-- Dual outward energy pulses -->
  <rect x="396" y="18" width="22" height="6" fill="#00f5d4" filter="url(#divGlow)" shape-rendering="crispEdges">
    <animate attributeName="x" values="396;24" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="462" y="18" width="22" height="6" fill="#ff2a85" filter="url(#divGlow)" shape-rendering="crispEdges">
    <animate attributeName="x" values="462;834" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- Pixel accents & terminal caps -->
  <g shape-rendering="crispEdges"><rect x="394" y="19" width="8" height="4" fill="#00f5d4"/><rect x="396" y="17" width="4" height="8" fill="#00f5d4"/><rect x="478" y="19" width="8" height="4" fill="#00f5d4"/><rect x="480" y="17" width="4" height="8" fill="#00f5d4"/><rect x="362" y="19" width="8" height="4" fill="#ffd166"/><rect x="364" y="17" width="4" height="8" fill="#ffd166"/><rect x="510" y="19" width="8" height="4" fill="#ffd166"/><rect x="512" y="17" width="4" height="8" fill="#ffd166"/><rect x="330" y="19" width="8" height="4" fill="#ff2a85"/><rect x="332" y="17" width="4" height="8" fill="#ff2a85"/><rect x="542" y="19" width="8" height="4" fill="#ff2a85"/><rect x="544" y="17" width="4" height="8" fill="#ff2a85"/><rect x="298" y="19" width="8" height="4" fill="#9d4edd"/><rect x="300" y="17" width="4" height="8" fill="#9d4edd"/><rect x="574" y="19" width="8" height="4" fill="#9d4edd"/><rect x="576" y="17" width="4" height="8" fill="#9d4edd"/><rect x="36" y="15" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="834" y="24" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="62" y="15" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="808" y="24" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="88" y="15" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="782" y="24" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="114" y="15" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="756" y="24" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="140" y="15" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="730" y="24" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="166" y="15" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="704" y="24" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="192" y="15" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="678" y="24" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="218" y="15" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="652" y="24" width="10" height="3" fill="#00f5d4" opacity="0.75"/><rect x="244" y="15" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="626" y="24" width="10" height="3" fill="#ff2a85" opacity="0.75"/><rect x="12" y="15" width="10" height="12" fill="#0d0f22" stroke="#ff2a85" stroke-width="1.5"/><rect x="15" y="18" width="4" height="6" fill="#00f5d4"/><rect x="858" y="15" width="10" height="12" fill="#0d0f22" stroke="#00f5d4" stroke-width="1.5"/><rect x="861" y="18" width="4" height="6" fill="#ff2a85"/></g>

  <!-- Centerpiece Neon Sakura Crest -->
  <rect x="414" y="3" width="52" height="36" rx="4" fill="#0d0a1f" stroke="#ff2a85" stroke-width="1.5"/>
  <g filter="url(#divGlow)"><path d="M431,6h6v3h-6zM443,6h6v3h-6zM428,9h24v3h-24zM425,12h6v3h-6zM437,12h6v3h-6zM449,12h6v3h-6zM422,15h6v3h-6zM452,15h6v3h-6zM425,18h6v3h-6zM449,18h6v3h-6zM428,21h6v3h-6zM446,21h6v3h-6zM425,24h6v3h-6zM437,24h6v3h-6zM449,24h6v3h-6zM422,27h6v3h-6zM452,27h6v3h-6zM425,30h6v3h-6zM449,30h6v3h-6zM428,33h3v3h-3zM449,33h3v3h-3z" fill="#ff2a85" shape-rendering="crispEdges"/>
  <path d="M431,12h6v3h-6zM443,12h6v3h-6zM428,15h6v3h-6zM446,15h6v3h-6zM431,18h3v3h-3zM446,18h3v3h-3zM431,24h6v3h-6zM443,24h6v3h-6zM428,27h6v3h-6zM446,27h6v3h-6z" fill="#ff9ed2" shape-rendering="crispEdges"/>
  <path d="M434,15h12v3h-12zM434,18h12v3h-12zM434,21h12v3h-12z" fill="#ffd166" shape-rendering="crispEdges"/></g>
