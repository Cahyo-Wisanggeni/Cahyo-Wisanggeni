name: Build Unified Japanese Sunset Profile

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate live contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/raw-snake.svg?palette=github-dark&color_snake=#ff2a85&color_dots=#161b22,#3b0764,#7e22ce,#00f5d4,#ffd166

      - name: Build unified Japanese Neon Sunset profile SVG and publish
        run: |
          TMPDIR=$(mktemp -d)
          python3 .github/scripts/build_profile_canvas.py dist/raw-snake.svg "$TMPDIR/github-profile-tokyo.svg"
          cd "$TMPDIR"
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-profile-tokyo.svg
          git commit -m "chore: update unified Neo-Tokyo sunset profile SVG"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
