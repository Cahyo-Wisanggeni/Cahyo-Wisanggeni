name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate neon snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-neon.svg?palette=github-dark&color_snake=#ff2a85&color_dots=#161b22,#3b0764,#7e22ce,#00f5d4,#ffd166

      - name: Enhance snake into Neon Pixel Arcade Cabinet and publish
        run: |
          TMPDIR=$(mktemp -d)
          python3 .github/scripts/enhance_snake.py dist/github-contribution-grid-snake-neon.svg "$TMPDIR/github-contributors-snake.svg"
          cd "$TMPDIR"
          git init -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contributors-snake.svg
          git commit -m "chore: update CONTRIBUTORS night city neon snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
